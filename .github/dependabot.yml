version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Titles follow conventional commits, as semantic-release reads them. A runtime dependency update is a fix and
    # releases a patch; dev dependencies and workflow updates do not release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
