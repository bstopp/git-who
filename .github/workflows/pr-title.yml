name: PR title

# With squash merging the pull request title becomes the commit message on main, and semantic-release reads that to
# decide whether to release. A title it cannot read would be ignored without any warning.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a conventional commit
        env:
          # Passed through the environment, not pasted into the script, so a title cannot inject commands.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|chore|ci|test|refactor|build|style|revert)(\([^)]+\))?!?: .+$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The PR title must look like 'type: description', 'type(scope): description' or 'type!: description'."
            echo "Types: feat, fix, perf, docs, chore, ci, test, refactor, build, style, revert."
            echo "Got: $TITLE"
            exit 1
          fi
